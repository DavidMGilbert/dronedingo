# ============================================================================
#  DroneDingo — appliance configuration
#  Edit brand.product_name to re-badge the whole UI in one place.
# ============================================================================

brand:
  product_name: "DroneDingo"
  tagline: "Your watchdog for the sky"
  model: "DroneDingo"        # hardware model name shown under System (TBD)
  copyright: "© 2026 David M. Gilbert. All rights reserved."
  website: null              # shown in the About dialog if set
  # Palette — "outback" warm ochre on warm charcoal. Every colour below drives
  # the UI *and* the map style, so re-theming the product is a config change.
  accent: "#E8963C"          # primary — brand, drone contacts
  accent_alt: "#16A99A"      # secondary — operator (pilot) positions
  home: "#4E6BE6"            # Home Base marker + range rings
  danger: "#E5484D"          # proximity breach / threat state

site:
  # Leave as "dingo-01": each appliance mints its own unique node id on first
  # boot (stored in data/state.json). Set a specific value only to pin one.
  node_id: "dingo-01"
  home:
    label: "Home Base"
    lat: 52.2405              # default map centre; override from the UI
    lon: -0.9027
    set: false               # becomes true once configured from the UI

map:
  # Fallback used when no offline basemap is configured (requires internet).
  tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  max_zoom: 19
  default_zoom: 15
  # Alert range rings drawn around Home Base, in metres.
  range_rings_m: [250, 500, 1000]

  # ---- Offline basemap (recommended — most farms have poor connectivity) ---
  # Drop a .pmtiles or .mbtiles file on the appliance and point `path` at it.
  # The appliance then serves its own tiles and needs no internet at all.
  # Vector tiles are styled live from the brand palette above, so the map
  # matches the product. See docs/OFFLINE_MAPS.md for getting a region file.
  basemap:
    path: null                # e.g. "data/basemap/northamptonshire.pmtiles"
    schema: "protomaps"       # "protomaps" (default) or "openmaptiles"
    # Vector labels need glyph files. Leave null for a clean label-free map;
    # set to a served glyphs URL to switch place names on.
    glyphs_url: null          # e.g. "/vendor/glyphs/{fontstack}/{range}.pbf"

sources:
  # ---- Identity + position (2.4/5.8 GHz Remote ID & DJI DroneID) ----------
  simulator:
    # Synthetic traffic for demos/testing. OFF by default so a fresh install
    # shows only real contacts; turn it on any time from Settings → System →
    # "Demo mode" (persists), or set true here.
    enabled: false
  wifi_remoteid:
    enabled: false
    interface: "wlan1"        # must support monitor mode
  bt_remoteid:
    enabled: false
    adapter: "hci0"
  # ---- Presence-only backstop (sub-1.7 GHz, RTL-SDR) ----------------------
  rtlsdr_scan:
    enabled: false
    device_index: 0
    gain: "auto"
    dwell_s: 0.25             # seconds sampled per band
    trigger_db: 8.0           # dB above noise floor to declare a hit
    bands:
      - { name: "433 MHz telemetry",   start: 433050000,  stop: 434790000 }
      - { name: "900 MHz control",     start: 902000000,  stop: 928000000 }
      - { name: "1.2 GHz analog video", start: 1240000000, stop: 1300000000 }

alerts:
  # Phone alerts are delivered by DroneDingo Push (see the `push:` block) —
  # proprietary, end-to-end encrypted, no third-party app. Register phones from
  # the dashboard (Settings → Alerts).
  webhook_url: null           # optional JSON POST target for other integrations

  # Alert when a contact comes within this many metres of Home Base.
  # Defaults to the innermost range ring if left null.
  alert_ring_m: null
  # Don't re-alert for the same drone until it has been gone this long (seconds).
  # Prevents one overflight generating hundreds of notifications.
  resight_after_s: 300

  quiet_hours: null           # e.g. "22:00-06:00"
  # Overnight is exactly when theft happens, so quiet hours do NOT suppress
  # alerts unless you explicitly opt in here.
  quiet_hours_suppress: false

push:
  # DroneDingo Push — proprietary, appliance-direct, end-to-end encrypted phone
  # alerts (Web Push). No third-party app, no Apple/Google developer account.
  # The VAPID key pair is generated on first run and kept in data/state.json.
  # Register phones from the dashboard (Settings → Alerts → Add a phone).
  enabled: true
  subject: "mailto:admin@dronedingo.com.au"   # VAPID contact (per RFC 8292)
  # Optional. If this appliance's dashboard is reachable at a URL (e.g. its
  # LAN address like http://192.168.1.50:8000, or a public https address),
  # set it here and tapping an alert deep-links to the operator's location +
  # aircraft. Leave null to just show the alert (it already carries the range,
  # bearing and operator coordinates in its text).
  portal_url: null

remote_access:
  # Secure remote dashboard access (dashboard.dronedingo.com.au). The appliance
  # makes an OUTBOUND connection only — no port forwarding, works behind DHCP /
  # CGNAT — and authenticates with its own enrolled per-node key. OFF by default
  # for privacy; enable per appliance from Settings → System → "Remote access".
  enabled: false

updates:
  # Production appliances update from the website (see docs/UPDATE_PROTOCOL.md).
  # Set check_url to switch from the git-checkout dev flow to signed releases.
  channel: "stable"                  # or "beta"
  check_url: null                    # https://update.dronedingo.com.au/api/v1/updates/latest
  token: null                        # per-appliance bearer token (provisioning)
  public_key: null                   # base64 raw Ed25519 key that signs releases
  auto_check: true                   # check on a schedule; never auto-install
  branch: "main"                     # git fallback when check_url is null (dev)

auth:
  # The web UI is gated behind an admin email + password login. Credentials are
  # set at installation (installer prompt or DRONEDINGO_ADMIN_EMAIL/_PASSWORD),
  # or on first web visit if none were provided. They are stored hashed
  # (PBKDF2) in data/state.json, never here. Locked out? Reset from the Pi
  # console: sudo bash /opt/dronedingo/deploy/reset-admin.sh
  enabled: true
  session_hours: 168         # how long a login stays valid

server:
  host: "0.0.0.0"
  port: 8000

retention_days: 90            # detections older than this are pruned
