<!doctype html>
<html lang="en-AU" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DroneDingo</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/vendor/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/vendor/brand/favicon-64.png" />
  <link rel="apple-touch-icon" href="/vendor/brand/icon-180.png" />
  <link rel="manifest" href="/vendor/brand/site.webmanifest" />
  <meta name="theme-color" content="#0c2224" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/clock.css" />
  <link rel="stylesheet" href="/css/viewport.css" />
  <link rel="stylesheet" href="/css/contrast.css" />
  <link rel="stylesheet" href="/css/app-ui.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar glass">
    <a class="brand" href="#" aria-label="DroneDingo home">
      <img class="brand-mark" src="/vendor/brand/mark.png" alt="" />
      <span><strong>Drone<span>Dingo</span></strong><small id="tagline">Your watchdog for the sky</small></span>
    </a>
    <div class="system-summary">
      <span><i class="live-dot" id="live-dot"></i><b id="link-text">CONNECTING</b></span>
      <span><b id="contact-count">0</b> CONTACTS</span>
      <span>NODE <b id="node-id">—</b></span>
      <span class="vfd-clock" aria-label="Local date and time"><time id="clock">--:--:--</time><time id="current-date">—</time></span>
    </div>
    <nav class="top-actions">
      <button class="icon-button" id="sightings-open" aria-label="Open sighting log" title="Sighting log">↻</button>
      <button class="icon-button" id="theme-toggle" aria-label="Change colour theme" title="Theme">☀</button>
      <button class="icon-button" id="settings-open" aria-label="Open settings" title="Settings">⚙</button>
    </nav>
  </header>

  <div class="alert-strip" id="alert-strip" hidden>
    <span class="alert-icon">▲</span><span id="alert-text"></span><time id="alert-time">NOW</time>
  </div>

  <div class="workspace">
    <aside class="contacts-panel glass">
      <div class="panel-heading"><strong>Active contacts</strong><span id="contacts-sub">Live</span></div>
      <div id="contact-list"></div>
      <div id="contacts-empty">Scanning…</div>
    </aside>
    <main class="map-panel" aria-label="Property map with live drone and operator positions">
      <div id="map"></div>
      <div class="map-legend glass">
        <span><i class="legend-drone"></i>Drone</span>
        <span><i class="legend-operator"></i>Operator</span>
        <span>⌂ Home base</span>
        <span id="basemap-info"></span>
      </div>
    </main>
  </div>

  <footer class="modebar glass">
    <button class="active" data-mode="live" id="mode-live">LIVE</button>
    <button data-mode="review" id="mode-review">REVIEW</button>
    <div class="pb" id="pb" hidden>
      <button class="pb-play" id="pb-play" aria-label="Play / pause">▶</button>
      <input type="range" id="pb-scrub" min="0" max="1000" value="1000" />
      <span class="pb-time" id="pb-time">—</span>
      <select id="pb-speed" title="Playback speed">
        <option value="1">1×</option><option value="4" selected>4×</option>
        <option value="16">16×</option><option value="60">60×</option>
      </select>
      <select id="pb-window" title="Review window">
        <option value="900">15 min</option><option value="3600" selected>1 hour</option>
        <option value="21600">6 hours</option><option value="86400">24 hours</option>
      </select>
    </div>
  </footer>

  <!-- ============================ MODALS ============================ -->
  <div class="modal-layer" id="modal-layer" hidden>
    <section class="modal glass" id="settings-modal" hidden aria-labelledby="settings-title">
      <header class="modal-header"><h2 id="settings-title">Settings</h2>
        <button class="icon-button close-modal" aria-label="Close">×</button></header>
      <div class="settings-layout">
        <nav class="settings-nav" id="settings-nav"></nav>
        <div class="settings-content" id="settings-content"></div>
      </div>
    </section>

    <section class="modal glass" id="sightings-modal" hidden aria-labelledby="sightings-title">
      <header class="modal-header">
        <div><h2 id="sightings-title">Sighting log</h2><p>Recorded drone broadcasts and detection history</p></div>
        <button class="icon-button close-modal" aria-label="Close">×</button>
      </header>
      <div class="table-wrap"><table>
        <thead><tr><th>Aircraft</th><th>First seen</th><th>Duration</th><th>Peak height</th><th>Hits</th></tr></thead>
        <tbody id="sighting-rows"></tbody>
      </table></div>
      <footer class="pagination"><span id="page-caption"></span>
        <div><button id="page-prev">Previous</button><button id="page-next">Next</button></div>
      </footer>
    </section>

    <section class="modal glass detail-modal" id="detail-modal" hidden aria-labelledby="detail-title">
      <header class="modal-header">
        <div><p class="modal-kicker">Detected aircraft</p><h2 id="detail-title">Aircraft details</h2></div>
        <button class="icon-button close-modal" aria-label="Close">×</button>
      </header>
      <div class="identity-row">
        <span class="large-drone-icon" id="detail-icon"></span>
        <div><strong id="detail-name"></strong><small id="detail-id"></small></div>
        <span class="distance-display" id="detail-distance"></span>
      </div>
      <div class="detail-grid" id="detail-grid"></div>
      <footer class="modal-actions">
        <button id="detail-history">View sighting history</button>
        <button class="primary close-modal">Done</button>
      </footer>
    </section>
  </div>
</div>

<script src="/vendor/maplibre/maplibre-gl.js"></script>
<script src="/vendor/qr/qrcode.js"></script>
<script src="/vendor/qr/dd-qr.js"></script>
<script src="/js/map.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
