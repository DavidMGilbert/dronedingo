<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DroneDingo</title>
  <link rel="icon" type="image/png" href="/vendor/brand/favicon-64.png" />
  <link rel="stylesheet" href="/css/fonts.css?v=2" />
  <style>
    :root {
      --bg: #061416; --bg-2: #0c2224; --panel: rgba(14,36,38,.82);
      --line: rgba(255,255,255,.14); --text: #edf5f2;
      --muted: #93a9a5; --accent: #ed9800; --on-accent: #14100a;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#dfe8e2; --bg-2:#edf2ed; --panel:rgba(250,252,249,.86);
              --line:rgba(18,48,44,.15); --text:#172629; --muted:#61736f; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: var(--text); font: 400 15px/1.5 "Barlow", system-ui, sans-serif;
      background:
        radial-gradient(circle at 78% 10%, rgba(237,152,0,.12), transparent 30%),
        radial-gradient(circle at 15% 88%, rgba(104,234,208,.10), transparent 34%),
        var(--bg);
    }
    .card {
      width: min(92vw, 380px); background: var(--panel);
      border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px;
      box-shadow: inset 1px 1px rgba(255,255,255,.08), 0 20px 60px rgba(0,0,0,.4);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .brand img { height: 50px; width: auto; }
    .brand .name {
      font-family: "Barlow Condensed", sans-serif; font-weight: 800;
      font-size: 30px; line-height: .9;
    }
    .brand .name .b2 { color: var(--accent); }
    .tag { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    label { display: block; font-size: 12px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
            font-family: "Barlow Condensed", sans-serif; font-weight: 600; }
    input + label { margin-top: 14px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 15px;
      background: var(--bg); border: 1px solid var(--line); color: var(--text);
      font-family: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%; margin-top: 18px; padding: 12px; border: 0; cursor: pointer;
      border-radius: 10px; background: var(--accent); color: var(--on-accent);
      font-family: "Barlow", sans-serif; font-weight: 600; font-size: 15px;
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: #E5484D; font-size: 13px; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">
      <img src="/vendor/brand/mark.png" alt="" />
      <span class="name">Drone<span class="b2">Dingo</span></span>
    </div>
    <p class="tag">Your watchdog for the sky</p>

    <h1 id="title">Sign in</h1>
    <p class="hint" id="hint">Enter your admin email and password.</p>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username"
           required placeholder="you@example.com" />

    <label for="password" id="pwLabel">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required minlength="8" />

    <button type="submit" id="submit">Sign in</button>
    <div class="err" id="error"></div>
  </form>

  <script>
    const $ = (id) => document.getElementById(id);
    let firstRun = false;

    // White-charcoal mark on the dark card; original on light.
    if (matchMedia("(prefers-color-scheme: dark)").matches) {
      document.querySelectorAll(".brand img").forEach((i) => i.src = "/vendor/brand/mark-dark.png");
    }

    async function init() {
      try {
        const s = await (await fetch("/api/auth/status")).json();
        if (s.authenticated) {
          const nxt = new URLSearchParams(location.search).get("next");
          location.href = (nxt && nxt.startsWith("/") && !nxt.startsWith("//")) ? nxt : "/";
          return;
        }
        firstRun = !s.configured;
      } catch (_) {}
      if (firstRun) {
        $("title").textContent = "Create admin account";
        $("hint").textContent =
          "This is the first run. Set the admin email and password that will "
          + "protect the dashboard (password minimum 8 characters).";
        $("pwLabel").textContent = "New password";
        $("password").setAttribute("autocomplete", "new-password");
        $("submit").textContent = "Create & sign in";
      }
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("error").textContent = "";
      $("submit").disabled = true;
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: $("email").value, password: $("password").value }),
        });
        const d = await r.json();
        if (r.ok && d.ok) {
          const nxt = new URLSearchParams(location.search).get("next");
          location.href = (nxt && nxt.startsWith("/") && !nxt.startsWith("//")) ? nxt : "/";
          return;
        }
        $("error").textContent = d.error || "Sign in failed.";
      } catch (_) {
        $("error").textContent = "Network error.";
      } finally {
        $("submit").disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
