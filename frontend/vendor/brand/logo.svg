<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DroneDingo mark: dingo head watching a quadcopter, from the brand logo.
       Two-tone ochre/charcoal with a white cheek flash and detection arcs. -->
  <defs>
    <linearGradient id="ddOchre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2A94F"/>
      <stop offset="100%" stop-color="#D9781F"/>
    </linearGradient>
  </defs>

  <!-- back of head / ear (ochre) -->
  <path fill="url(#ddOchre)"
        d="M12 9 22 17c3-1.4 6.4-2.1 9.8-2 L28 4 20 6z"/>
  <!-- head + muzzle + neck (charcoal) -->
  <path fill="#23262B"
        d="M31.8 15C22 15 14 22.4 14 33c0 9.4 5.4 17.6 12 22.4V40c0-3 .8-5.7 2.2-8
           C25 34 22 33 22 33s6-2 12-2c5 0 9 2.5 9 7 0 3-2 5.3-5 6.4
           C43.4 42 48 37 48 30.2 48 21.4 41 15 31.8 15z"/>
  <!-- ochre cheek/jaw accent over the charcoal -->
  <path fill="url(#ddOchre)"
        d="M14 33c0-9 6.6-15.8 15-17.7C21 18 16 24.6 16 33c0 8 4 15 9.9 19.7
           C20 48 14 41 14 33z"/>
  <!-- white cheek flash -->
  <path fill="#F7F4EE" d="M27 30c2.2-1 5-1.4 7.6-1.2L30 41c-1-3-2.4-8-3-11z"/>
  <!-- eye -->
  <circle cx="30.6" cy="26.4" r="2.1" fill="#16181B"/>

  <!-- quadcopter -->
  <g fill="#16181B">
    <rect x="46" y="12" width="12" height="2.4" rx="1.2"/>
    <rect x="45.4" y="9.4" width="3" height="6" rx="1"/>
    <rect x="55.6" y="9.4" width="3" height="6" rx="1"/>
    <circle cx="52" cy="15.6" r="2.2"/>
  </g>
  <!-- detection arcs between muzzle and drone -->
  <g fill="none" stroke="url(#ddOchre)" stroke-width="2.3" stroke-linecap="round">
    <path d="M40 22a7 7 0 0 1 5-4"/>
    <path d="M42 26a11 11 0 0 1 7.6-6.4"/>
  </g>
</svg>
